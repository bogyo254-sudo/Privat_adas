<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Élő Adás</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0b0d11; color: #f1f5f9;
      min-height: 100vh; display: flex; justify-content: center;
    }

    /* TISZTA NÉZŐI MÓD: csak a videó */
    body.viewer-only {
      background: #000; width: 100vw; height: 100vh; overflow: hidden;
    }
    body.viewer-only .studio-wrap {
      display: none;
    }
    .viewer-stage {
      display: none; position: fixed; inset: 0; background: #000;
      align-items: center; justify-content: center;
    }
    body.viewer-only .viewer-stage {
      display: flex;
    }
    .viewer-stage video {
      width: 100%; height: 100%; object-fit: contain; background: #000;
    }
    .viewer-overlay {
      position: absolute; inset: 0; background: #000; color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; font-size: 18px;
    }
    .hidden { display: none !important; }

    /* SAJÁT VEZÉRLŐ + ELŐNÉZET */
    .studio-wrap {
      width: 100%; max-width: 780px; padding: 16px;
      display: grid; gap: 16px;
    }
    .card {
      background: #161a22; border: 1px solid #262c3a;
      border-radius: 14px; padding: 16px; display: grid; gap: 12px;
    }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; color: #cbd5e1; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
    input, textarea, select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #2b3242; background: #0d1016; color: #f8fafc; font-size: 14px;
    }
    textarea { min-height: 105px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      background: #2563eb; color: #fff; border: none; border-radius: 10px;
      padding: 10px 15px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #2c3444; }
    button.secondary:hover { background: #3b465c; }
    button.success { background: #16a34a; }
    button.success:hover { background: #15803d; }

    .link-box {
      background: #0d1016; border: 1px dashed #3b82f6;
      border-radius: 10px; padding: 10px 12px; word-break: break-all;
      font-size: 13px; color: #93c5fd;
    }
    .status-line { font-size: 13px; color: #4ade80; min-height: 18px; }
    .preview-video {
      width: 100%; max-height: 340px; background: #000; border-radius: 10px;
    }
    .pill {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700; background: #dc2626; color: #fff;
    }
    .pill.muted { background: #475569; }
  </style>
</head>
<body>

  <!-- 1. NÉZŐI NÉZET: CSAK AZ ADÁS -->
  <div class="viewer-stage" id="viewerStage">
    <video id="viewerVideo" playsinline autoplay></video>
    <div class="viewer-overlay" id="viewerOverlay">Adás betöltése...</div>
  </div>

  <!-- 2. SAJÁT VEZÉRLŐ + ELŐNÉZET -->
  <div class="studio-wrap" id="studioWrap">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <h1>Adás Beállítása és Nézői Link</h1>
        <span id="studioBadge" class="pill muted">VÁRAKOZÁS</span>
      </div>

      <div class="grid-2">
        <div>
          <label for="startDate">1. videó kezdőnapja</label>
          <input type="date" id="startDate" />
        </div>
        <div>
          <label for="dailyStartTime">Napi indulási időpont</label>
          <input type="time" id="dailyStartTime" />
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="playMode">Automatikus lejátszás</label>
          <select id="playMode">
            <option value="auto">BE — Napi ütemezés + naponta váltó videó</option>
            <option value="manual">KI — Manuálisan kiválasztott videó</option>
          </select>
        </div>
        <div>
          <label for="manualIndex">Kézi módhoz kiválasztott videó</label>
          <select id="manualIndex"></select>
        </div>
      </div>

      <div>
        <label for="videoList">Videólinkek sorrendben (soronként 1 közvetlen videólink; végén elölről indul)</label>
        <textarea id="videoList"></textarea>
      </div>

      <div class="btn-row">
        <button onclick="applyAndGenerateLink()">Beállítás és nézői link frissítése</button>
        <button class="secondary" onclick="syncPlayer(true)">Szinkronizálás most</button>
      </div>

      <div class="status-line" id="statusMsg"></div>
    </div>

    <div class="card">
      <h2>Automatikusan kiadott nézői link (ezt küldd el a nézőknek)</h2>
      <div class="link-box" id="viewerLinkBox"></div>
      <div class="btn-row">
        <button class="success" onclick="copyViewerLink()">Nézői link másolása</button>
        <button class="secondary" onclick="openViewerPreview()">Nézői nézet megnyitása</button>
      </div>
    </div>

    <div class="card">
      <h2>Saját nézet / Előnézet</h2>
      <div style="font-size:13px; color:#94a3b8;" id="studioInfo">Betöltés...</div>
      <video class="preview-video" id="studioVideo" controls playsinline></video>
    </div>
  </div>

  <script>
    const DEFAULT_CFG = {
      startDate: "2026-11-26",
      dailyStartTime: "19:00",
      autoPlay: true,
      manualIndex: 0,
      videos: [
        "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
        "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
        "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
      ]
    };

    function encodeCfg(cfg) {
      const jsonStr = JSON.stringify(cfg);
      const bytes = new TextEncoder().encode(jsonStr);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeCfg(token) {
      try {
        let b64 = token.replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const parsed = JSON.parse(new TextDecoder().decode(bytes));
        return {
          ...DEFAULT_CFG,
          ...parsed,
          videos: Array.isArray(parsed.videos) && parsed.videos.length > 0 ? parsed.videos : DEFAULT_CFG.videos
        };
      } catch {
        return DEFAULT_CFG;
      }
    }

    const params = new URLSearchParams(window.location.search);
    const isViewerMode = params.get("view") === "1";

    let activeCfg = params.get("cfg") ? decodeCfg(params.get("cfg")) : { ...DEFAULT_CFG };
    let lastLoadedUrl = "";

    if (isViewerMode) {
      document.body.classList.add("viewer-only");
    }

    function getDayDiff(startDateStr, now) {
      const [y, m, d] = (startDateStr || DEFAULT_CFG.startDate).split("-").map(Number);
      const start = new Date(y, (m || 1) - 1, d || 1, 0, 0, 0);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
      return diff < 0 ? 0 : diff;
    }

    function getElapsedSeconds(dailyStartTimeStr, now) {
      const [hh, mm] = (dailyStartTimeStr || "19:00").split(":").map(Number);
      const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh || 0, mm || 0, 0);
      return (now - startToday) / 1000;
    }

    function buildViewerUrl(cfg) {
      const base = window.location.href.split("?")[0];
      return `${base}?view=1&cfg=${encodeCfg(cfg)}`;
    }

    function refreshManualSelect(videos, selected) {
      const sel = document.getElementById("manualIndex");
      if (!sel) return;
      sel.innerHTML = "";
      videos.forEach((_, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${idx + 1}. videó`;
        if (idx === selected) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function fillFormFromCfg(cfg) {
      if (isViewerMode) return;
      document.getElementById("startDate").value = cfg.startDate;
      document.getElementById("dailyStartTime").value = cfg.dailyStartTime;
      document.getElementById("playMode").value = cfg.autoPlay ? "auto" : "manual";
      document.getElementById("videoList").value = cfg.videos.join("\n");
      refreshManualSelect(cfg.videos, cfg.manualIndex || 0);
      document.getElementById("viewerLinkBox").textContent = buildViewerUrl(cfg);
    }

    function applyAndGenerateLink() {
      const lines = document.getElementById("videoList").value
        .split("\n")
        .map(s => s.trim())
        .filter(Boolean);

      if (lines.length === 0) {
        document.getElementById("statusMsg").textContent = "Adj meg legalább egy videólinket!";
        return;
      }

      const idx = Math.min(Number(document.getElementById("manualIndex").value || 0), lines.length - 1);
      activeCfg = {
        startDate: document.getElementById("startDate").value || DEFAULT_CFG.startDate,
        dailyStartTime: document.getElementById("dailyStartTime").value || DEFAULT_CFG.dailyStartTime,
        autoPlay: document.getElementById("playMode").value === "auto",
        manualIndex: idx,
        videos: lines
      };

      refreshManualSelect(lines, idx);
      const viewerUrl = buildViewerUrl(activeCfg);
      document.getElementById("viewerLinkBox").textContent = viewerUrl;

      // Frissítjük a saját böngésző címsorát is (view nélkül), hogy frissítéskor megmaradjon
      const cleanSelfUrl = `${window.location.href.split("?")[0]}?cfg=${encodeCfg(activeCfg)}`;
      window.history.replaceState({}, "", cleanSelfUrl);

      document.getElementById("statusMsg").textContent = "Beállítva! A nézői link frissítve.";
      lastLoadedUrl = "";
      syncPlayer(true);
    }

    function copyViewerLink() {
      const link = buildViewerUrl(activeCfg);
      navigator.clipboard?.writeText(link).then(() => {
        document.getElementById("statusMsg").textContent = "Nézői link vágólapra másolva!";
      }).catch(() => {
        document.getElementById("statusMsg").textContent = "Másold ki a fenti mezőből a nézői linket.";
      });
    }

    function openViewerPreview() {
      window.open(buildViewerUrl(activeCfg), "_blank");
    }

    function syncPlayer(forceSeek = false) {
      const now = new Date();
      const targetVideoEl = isViewerMode ? document.getElementById("viewerVideo") : document.getElementById("studioVideo");
      const overlayEl = document.getElementById("viewerOverlay");
      const studioBadge = document.getElementById("studioBadge");
      const studioInfo = document.getElementById("studioInfo");

      if (!activeCfg.autoPlay) {
        const idx = Math.min(Math.max(0, activeCfg.manualIndex || 0), activeCfg.videos.length - 1);
        const url = activeCfg.videos[idx];
        if (lastLoadedUrl !== url) {
          lastLoadedUrl = url;
          targetVideoEl.src = url;
        }
        if (overlayEl) overlayEl.classList.add("hidden");
        if (studioBadge) {
          studioBadge.textContent = "MANUÁLIS ADÁS";
          studioBadge.classList.remove("muted");
        }
        if (studioInfo) studioInfo.textContent = `Kézi mód — ${idx + 1}. videó`;
        targetVideoEl.play().catch(() => {});
        return;
      }

      const elapsed = getElapsedSeconds(activeCfg.dailyStartTime, now);
      const dayIdx = getDayDiff(activeCfg.startDate, now);
      const videoIdx = dayIdx % activeCfg.videos.length;
      const url = activeCfg.videos[videoIdx];

      if (elapsed < 0) {
        const mins = Math.ceil(Math.abs(elapsed) / 60);
        const msg = `Az adás ${activeCfg.dailyStartTime}-kor kezdődik (${mins} perc múlva).`;
        targetVideoEl.pause();
        if (overlayEl) {
          overlayEl.textContent = msg;
          overlayEl.classList.remove("hidden");
        }
        if (studioBadge) {
          studioBadge.textContent = "VÁRAKOZÁS";
          studioBadge.classList.add("muted");
        }
        if (studioInfo) studioInfo.textContent = `${msg} (Ma a ${videoIdx + 1}. videó jön.)`;
        return;
      }

      if (!isNaN(targetVideoEl.duration) && elapsed >= targetVideoEl.duration) {
        const msg = "A mai adás véget ért.";
        targetVideoEl.pause();
        if (overlayEl) {
          overlayEl.textContent = msg;
          overlayEl.classList.remove("hidden");
        }
        if (studioBadge) {
          studioBadge.textContent = "BEFEJEZVE";
          studioBadge.classList.add("muted");
        }
        if (studioInfo) studioInfo.textContent = msg;
        return;
      }

      if (lastLoadedUrl !== url) {
        lastLoadedUrl = url;
        targetVideoEl.src = url;
      }

      if (overlayEl) overlayEl.classList.add("hidden");
      if (studioBadge) {
        studioBadge.textContent = "ÉLŐ ADÁS";
        studioBadge.classList.remove("muted");
      }
      if (studioInfo) {
        studioInfo.textContent = `Élőben megy a ${videoIdx + 1}. videó (${Math.floor(elapsed / 60)}. percnél).`;
      }

      if (!isNaN(targetVideoEl.duration) && (forceSeek || Math.abs(targetVideoEl.currentTime - elapsed) > 3)) {
        targetVideoEl.currentTime = elapsed;
      }

      targetVideoEl.play().catch(() => {
        if (overlayEl && isViewerMode) {
          overlayEl.textContent = "Koppints a képernyőre az adás elindításához.";
          overlayEl.classList.remove("hidden");
        }
      });
    }

    const activeVideo = isViewerMode ? document.getElementById("viewerVideo") : document.getElementById("studioVideo");

    activeVideo.addEventListener("loadedmetadata", () => {
      if (!activeCfg.autoPlay) return;
      const elapsed = getElapsedSeconds(activeCfg.dailyStartTime, new Date());
      if (elapsed > 0 && elapsed < activeVideo.duration) {
        activeVideo.currentTime = elapsed;
      }
    });

    activeVideo.addEventListener("seeking", () => {
      if (!activeCfg.autoPlay) return;
      const elapsed = getElapsedSeconds(activeCfg.dailyStartTime, new Date());
      if (elapsed > 0 && activeVideo.currentTime > elapsed + 2) {
        activeVideo.currentTime = elapsed;
      }
    });

    document.getElementById("viewerOverlay")?.addEventListener("click", () => {
      document.getElementById("viewerOverlay").classList.add("hidden");
      document.getElementById("viewerVideo").play().catch(() => {});
    });

    fillFormFromCfg(activeCfg);
    syncPlayer(true);
    setInterval(() => syncPlayer(false), 1000);
  </script>
</body>
</html>
